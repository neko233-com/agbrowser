<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { width: 300px; margin: 0; padding: 14px; background: #16181d; color: #e6e8ec;
         font: 13px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif; }
  h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
  .row { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #262a32; }
  .label { color:#9aa3b2; }
  .switch { position:relative; width:38px; height:21px; border-radius:11px; background:#3a3f4b; border:0; cursor:pointer; }
  .switch::after { content:''; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%; background:#fff; transition:.15s; }
  .switch[aria-checked="true"] { background:#22c55e; }
  .switch[aria-checked="true"]::after { left:19px; }
  .stat { font-variant-numeric: tabular-nums; }
  .muted { color:#6b7484; font-size:11px; margin-top:10px; }
</style>
</head>
<body>
  <h1>agb Shield</h1>
  <div class="row">
    <span class="label">广告与追踪隔离</span>
    <button id="toggle" class="switch" role="switch" aria-checked="true" aria-label="广告与追踪隔离"></button>
  </div>
  <div class="row"><span class="label">本次会话拦截请求</span><span class="value stat" id="total">0</span></div>
  <div id="hosts" class="muted"></div>
<script src="popup.js"></script>
</body>
</html>
