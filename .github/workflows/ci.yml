name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify icon generation is reproducible
        run: npm run icons

      - name: Run unit and integration tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Testing
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run browser end-to-end tests
        run: npm run test:e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax check every source file
        run: |
          find packages -name '*.js' -o -name '*.mjs' | while read -r f; do
            node --check "$f" || exit 1
          done

      - name: Verify every extension manifest parses
        run: |
          for m in extensions/*/manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$m','utf8'))" || exit 1
          done
